[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["notebooks", ".langgraph_api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/JS page, not Python.
"app/frontend.py" = ["E501"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.14"
venvPath = "."
venv = "venv"
typeCheckingMode = "basic"
